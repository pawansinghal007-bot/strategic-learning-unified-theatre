sonar.projectKey=strategic-learning-unified-theatre
sonar.projectName=Strategic Learning Unified Theatre
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/.git/**,**/coverage/**,**/dist/**,**/release/**,**/playwright-report/**,**/playwright-report-human/**,**/playwright-report-ui/**,**/test-results/**,**/.scannerwork/**,**/*.AppImage,**/*.asar,hello.py,fix-ipc.cjs
sonar.host.url=http://localhost:9000/
sonar.python.version=3.11
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=coverage/**,playwright-report/**,playwright-report-human/**,playwright-report-ui/**,test-results/**,.scannerwork/**,dist/**,release/**,node_modules/**,src/local-llm.js,src/accounts/profile-manager.js,src/ai-memory/index.js,src/knowledge/rag-dedup.js,src/knowledge/ingest/ingest-repository.js
sonar.scm.provider=git
# hwProbe.js is a plain-ESM runtime twin of hwProbe.ts (identical logic, no type
# annotations). A sonar.cpd.exclusions line for this file was considered and
# tested in Sprint 113 close-out (Aug 2026) but removed after a real scan
# confirmed hwProbe.js reports 0 duplicated_blocks / 0.0% density — there is
# nothing to suppress. The .ts/.js twin relationship is kept honest by the
# parity test at src/installer/hw-probe/hwProbe-parity.spec.ts instead.
sonar.test.inclusions=**/*.test.*,**/*.spec.*,**/__tests__/**
sonar.tests=tests
sonar.newCode.referenceBranch=main
